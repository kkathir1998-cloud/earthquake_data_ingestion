name: Earthquake Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Verify environment
        env:
          DATABRICKS_HOST: ${{ secrets.DB_HOST }}
          WAREHOUSE_ID: ${{ secrets.WAREHOUSE_ID }}
        run: |
          echo "DB Host configured"
          echo "Warehouse ID length: ${#WAREHOUSE_ID}"

      - name: Display script being executed
        run: |
          echo "===== FILE CONTENT ====="
          head -n 50 eq_data_ingest.py

      - name: Run earthquake ingestion
        env:
          DATABRICKS_HOST: ${{ secrets.DB_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DB_TOKEN }}
          WAREHOUSE_ID: ${{ secrets.WAREHOUSE_ID }}
        run: |
          python eq_data_ingest.py
